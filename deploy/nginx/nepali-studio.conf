# ==============================================================================
# Nepali Studio — Production Nginx Configuration
# Domain: nepali.dibe.sh
# ==============================================================================

# Rate limiting & connection limiting zones
limit_req_zone $binary_remote_addr zone=studio_api_run_limit:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=studio_api_ask_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=studio_general_limit:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=studio_conn_limit:10m;

upstream nepali_studio_upstream {
    server 127.0.0.1:8468;
    keepalive 32;
}

# ── 1. HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name nepali.dibe.sh;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://nepali.dibe.sh$request_uri;
    }
}

# ── 2. Main HTTPS server ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nepali.dibe.sh;

    # SSL Certificates
    ssl_certificate          /etc/letsencrypt/live/nepali.dibe.sh/fullchain.pem;
    ssl_certificate_key      /etc/letsencrypt/live/nepali.dibe.sh/privkey.pem;
    ssl_trusted_certificate  /etc/letsencrypt/live/nepali.dibe.sh/chain.pem;

    # SSL Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:nepali_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Stapling disabled to silence the no-OCSP-responder warning
    ssl_stapling off;
    ssl_stapling_verify off;

    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Payload & buffer limits
    client_max_body_size 2M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeouts
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 20s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript application/x-javascript
        application/wasm image/svg+xml;

    # ── Security Headers ────────────────────────────────────────────────────
    add_header X-Frame-Options              "DENY"                                                          always;
    add_header X-Content-Type-Options       "nosniff"                                                       always;
    add_header X-XSS-Protection             "1; mode=block"                                                 always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin"                               always;
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=(), payment=(), usb=()"  always;
    add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload"                  always;
    add_header Content-Security-Policy      "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https:; frame-ancestors 'none';" always;

    # ── Block hidden/sensitive files ────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* \.(toml|lock|bak|config|sql|sqlite|db|log|rs|cargo|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Next.js Static Assets (long-cached) ────────────────────────────────
    location /_next/static/ {
        proxy_pass http://nepali_studio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Public static files ─────────────────────────────────────────────────
    location ~* \.(ico|svg|png|jpg|jpeg|webp|wasm|woff2?|ttf|eot)$ {
        proxy_pass http://nepali_studio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
        access_log off;
    }

    # ── /api/run — Rate-limited code execution endpoint ────────────────────
    location /api/run {
        limit_req zone=studio_api_run_limit burst=5 nodelay;
        limit_conn studio_conn_limit 5;

        proxy_pass http://nepali_studio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── /api/ask — Rate-limited AI assistant endpoint ───────────────────────
    location /api/ask {
        limit_req zone=studio_api_ask_limit burst=3 nodelay;
        limit_conn studio_conn_limit 3;

        proxy_pass http://nepali_studio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── General routes ──────────────────────────────────────────────────────
    location / {
        limit_req zone=studio_general_limit burst=20 nodelay;
        limit_conn studio_conn_limit 20;

        proxy_pass http://nepali_studio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}