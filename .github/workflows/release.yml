name: Release & Multi-Platform Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Application & DMG
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'studio/package-lock.json'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Desktop App & DMG
        run: |
          chmod +x scripts/build-desktop.sh
          ./scripts/build-desktop.sh

      - name: Upload macOS Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg

  build-linux:
    name: Build Linux CLI & Engine
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies & Python dev
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: |
          cargo build --release --manifest-path crates/nepali-core/Cargo.toml --bin nepali-core-cli --no-default-features --features python-interop,rust-interop,js-interop,cache,studio,db
          mkdir -p dist
          cp crates/nepali-core/target/release/nepali-core-cli dist/nepali-linux-x86_64
          chmod +x dist/nepali-linux-x86_64
          tar -czvf dist/nepali-linux-x86_64.tar.gz -C dist nepali-linux-x86_64

      - name: Upload Linux Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/nepali-linux-x86_64.tar.gz
            dist/nepali-linux-x86_64

  build-windows:
    name: Build Windows CLI & Engine
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        shell: bash
        run: |
          cargo build --release --manifest-path crates/nepali-core/Cargo.toml --bin nepali-core-cli --no-default-features --features rust-interop,js-interop,cache,studio,db
          mkdir -p dist
          cp crates/nepali-core/target/release/nepali-core-cli.exe dist/nepali-windows-x86_64.exe

      - name: Upload Windows Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/nepali-windows-x86_64.exe
